<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="custom-panel main-header">
        <h1>Map</h1>
        
        <div class="search-container" id="searchContainer">
            <input type="text" id="searchInput" placeholder="Rechercher un lieu, QG, LSPD..." autocomplete="off">
            <button id="searchBtn" class="search-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <div id="searchResults" class="search-results"></div>
        </div>

        <div class="import-box">
            <label for="jsonImporter" class="import-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                <span>Ouvrir un JSON</span>
            </label>
            <input type="file" id="jsonImporter" accept=".json" style="display: none;">
        </div>
    </div>

    <div id="controlTrigger" class="custom-panel control-trigger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>Mode edition</span>
    </div>

    <div id="editorPanel" class="custom-panel editor-panel">
        <div class="panel-section">
            <div class="panel-title">Outils de dessin</div>
            <div class="tool-grid">
                <button class="tool-btn selected" data-type="marker">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span>Repere</span>
                </button>
                <button class="tool-btn" data-type="rectangle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
                    <span>Carre</span>
                </button>
                <button class="tool-btn" data-type="circle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                    <span>Rond</span>
                </button>
                <button class="tool-btn" data-type="polygon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l3 11 14 3 3-9z"/></svg>
                    <span>Perso</span>
                </button>
            </div>
        </div>

        <div class="panel-section">
            <div class="panel-title">Proprietes</div>
            <div class="form-group">
                <label for="elemTitle">Nom / Titre</label>
                <input type="text" id="elemTitle" class="form-control" placeholder="Ex: QG Ballas, Superette...">
            </div>
            <div class="form-group">
                <label for="elemDesc">Description</label>
                <input type="text" id="elemDesc" class="form-control" placeholder="Infos complémentaires...">
            </div>
            <div class="form-group-row">
                <div class="form-group">
                    <label for="elemCategory">Catégorie</label>
                    <input type="text" id="elemCategory" class="form-control" placeholder="Ex: Gang">
                </div>
                <div class="form-group">
                    <label for="elemSubCategory">Sous-Catégorie</label>
                    <input type="text" id="elemSubCategory" class="form-control" placeholder="Ex: Ballas">
                </div>
            </div>
        </div>

        <div class="panel-section">
            <div class="panel-title">Apparence</div>
            <div class="color-pickers">
                <div class="color-wrapper">
                    <input type="color" id="elemColor" value="#2563eb">
                    <span>Bordure</span>
                </div>
                <div class="color-wrapper">
                    <input type="color" id="elemFill" value="#2563eb">
                    <span>Fond</span>
                </div>
            </div>
        </div>

        <div class="panel-section" style="flex: 1; display: flex; flex-direction: column; min-height: 180px;">
            <div class="panel-title">elements de la session</div>
            <div class="items-list" id="itemsList"></div>
        </div>

        <div class="panel-section" style="display: flex; gap: 8px;">
            <button id="downloadJsonBtn" class="action-btn" style="background: #2563eb; color: white;">Télécharger JSON</button>
            <button id="clearAllBtn" class="action-btn btn-danger" style="margin-top: 0; flex: 1;">Vider</button>
        </div>
    </div>

    <div class="custom-panel view-panel">
        <div class="view-header">Style de la carte</div>
        <div class="view-selector">
            <button class="view-btn active" data-style="satellite">Satellite</button>
            <button class="view-btn" data-style="atlas">Atlas</button>
            <button class="view-btn" data-style="roadmap">Route</button>
        </div>
    </div>

    <div class="custom-panel legend-panel">
        <div class="legend-header">Legende</div>
        <div class="legend-list" id="legendList"></div>
    </div>

    <div id="map"></div>

    <div id="previewModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Aperçu du fichier</h2>
                <span id="closeModalBtn" class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <textarea id="jsonPreviewArea" readonly></textarea>
            </div>
            <div class="modal-footer">
                <button id="copyCodeBtn" class="action-btn" style="background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.15);">Copier le code</button>
                <button id="confirmDownloadBtn" class="action-btn" style="background: #2563eb; color: white;">Confirmer et Télécharger</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
